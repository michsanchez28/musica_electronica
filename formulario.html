<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="formulario.css">
</head>
<body>
         <h1>Formulario de Contacto</h1>
         <form action="" class="formulario">
              <label for="nombre">Nombre Completo</label>
              <input type="text" required>
              <label for="correo">Correo Electrónico</label>
              <input type="email" name="correo" id="" required>
              <label for="password">Password</label>
              <input type="password" name="" id="" required>
              <label for="edad">Edad</label>
              <input type="number" name="edad" id="" required>
              <label for="">Fecha</label>
              <input type="date" name="" id="">
              
              <div class="contenedor">
               <label for="sexo">Sexo: </label><br>
               <input type="radio" name="" id="">Mujer<br>                           
               <input type="radio" name="" id="">Hombre  <br>             
              </div>
              
              <div class="generos">
              <label for="generos">Música electrónica de tu interés: </label><br>
              <input type="checkbox" name="" id="">House y sus derivados<br>
              <input type="checkbox" name="" id="">Techno y subgéneros pesados<br>
              <input type="checkbox" name="" id="">Trance<br>
              <input type="checkbox" name="" id="">Bass / Dubstep<br>
              <input type="checkbox" name="" id="">Hardstyle<br>
              
              <label for="Comentarios">Escribe algun otro genero que escuches</label>
              <textarea name="" id="" required></textarea>
              </div>


              <input type="submit" value="Enviar" class="boton">
              <input type="reset" value="Limpiar" class="boton">
              

         </form>
</body>
</html>
